<form id="search" method="{{ method }}" action="{{ url_for('search') }}" role="search">
  <div id="search_header">
    <div class="interkid-search-unit">
      <a id="search_logo" href="{{ url_for('index') }}" tabindex="0" title="{{ _('Display the front page') }}">
        <span class="interkid-results-wordmark" draggable="false">interkid</span>
      </a>

      <div id="search_view">
        <div class="search_box">
          <svg class="interkid-results-search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="q" name="q" type="text" placeholder="{{ _('Search the internet') }}" tabindex="1"
            autocomplete="off" autocapitalize="none" spellcheck="false" autocorrect="off"
            enterkeyhint="search" dir="auto" value="{{ q or '' }}">
          <button id="clear_search" type="reset" aria-label="{{ _('clear') }}" class="hide_if_nojs">
            <span>{{ icon_big('close') }}</span><span class="show_if_nojs">{{ _('clear') }}</span>
          </button>
          <button id="send_search" type="submit" {%- if search_on_category_select -%}name="category_{{ selected_categories[0]|replace(' ', '_') }}"{%- endif -%} aria-label="{{ _('search') }}">
            <span class="hide_if_nojs">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="show_if_nojs">{{ _('search') }}</span>
          </button>
          <div class="autocomplete hide_if_nojs"><ul></ul></div>
        </div>
      </div>
    </div>

    <div class="interkid-categories-row">
      {% set display_tooltip = true %}
      {% include 'simple/categories.html' %}
    </div>
  </div>

  <div class="search_filters">
    {% include 'simple/filters/languages.html' %}
    {% include 'simple/filters/time_range.html' %}
  </div>

  <input type="hidden" name="safesearch" value="2">
  <input type="hidden" name="theme" value="{{ theme }}">
  {% if timeout_limit %}<input type="hidden" name="timeout_limit" value="{{ timeout_limit|e }}">{% endif %}
</form>
