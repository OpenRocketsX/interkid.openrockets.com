<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Interkid verification</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }
    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      margin: 0;
      padding: 0;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <iframe id="accounts-frame" title="OpenRockets Accounts" src="about:blank" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    (() => {
      const frame = document.getElementById("accounts-frame");
      let targetStarted = false;
      let completed = false;

      frame.addEventListener("load", () => {
        if (!targetStarted || completed) return;
        completed = true;

        window.setTimeout(() => {
          const secure = window.location.protocol === "https:" ? "; Secure" : "";
          document.cookie = `interkid_verification_seen=1; Max-Age=86400; Path=/; SameSite=Lax${secure}`;
          window.location.replace("/");
        }, 1000);
      });

      targetStarted = true;
      frame.src = "https://accounts.openrockets.com/";
    })();
  </script>
</body>
</html>
