name: Finish alwaysdata deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alwaysdata-finish.yml

permissions:
  contents: read
  issues: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALWAYSDATA_ACCOUNT: interkidtest
      HANDOFF_ISSUE: "3"
      TOKEN_APP_NAME: iutuy
    steps:
      - name: Generate run-bound encryption key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          pub="$(base64 -w0 /tmp/public.pem)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" -f body="ALWAYSDATA_PUBLIC_KEY_RUN_${GITHUB_RUN_ID}_B64=${pub}" >/dev/null

      - name: Receive run-bound encrypted token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prefix="ALWAYSDATA_CIPHERTEXT_RUN_${GITHUB_RUN_ID}="
          body=""
          for attempt in $(seq 1 120); do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" --paginate)"
            body="$(printf '%s' "$comments" | jq -r --arg prefix "$prefix" '[.[] | select(.body | startswith($prefix))][-1].body // ""')"
            [ -n "$body" ] && break
            sleep 5
          done
          [ -n "$body" ] || exit 1
          printf '%s' "${body#"$prefix"}" | base64 -d >/tmp/token.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/token.enc -out /tmp/token -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/token
          echo "::add-mask::$(cat /tmp/token)"

      - name: Convert default site to Interkid user program
        run: |
          set -eu
          token="$(cat /tmp/token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          address="${ALWAYSDATA_ACCOUNT}.alwaysdata.net/"
          sites="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/site/)"
          site_id="$(printf '%s' "$sites" | jq -r --arg a "$address" '.[] | select(any(.addresses[]?; . == $a)) | .id' | head -n1)"
          [ -n "$site_id" ] || { echo "Default alwaysdata site not found"; exit 1; }
          payload="$(jq -nc --arg address "$address" '{type:"user_program",addresses:[$address],command:"./start.sh",working_directory:"interkid-search",ssl_force:true,annotation:"Interkid Search"}')"
          response=/tmp/site-response.json
          code="$(curl -sS -o "$response" -w '%{http_code}' -X PATCH --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" "https://api.alwaysdata.com/v1/site/${site_id}/")"
          cat "$response"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "alwaysdata site update returned HTTP $code"; exit 1; fi
          printf '%s' "$site_id" >/tmp/site-id
          curl -fsS -X POST --basic --user "$auth" "https://api.alwaysdata.com/v1/site/${site_id}/restart/" >/dev/null

      - name: Verify homepage and search
        run: |
          set -eu
          base="https://${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          ready=0
          for attempt in $(seq 1 60); do
            if curl -LfsS --max-time 20 "$base/" -o /tmp/home.html && grep -qi 'interkid' /tmp/home.html; then ready=1; break; fi
            sleep 5
          done
          [ "$ready" = 1 ] || { echo "Interkid homepage did not become ready"; exit 1; }
          curl -LfsS --max-time 60 "$base/search?q=openrockets" -o /tmp/search.html
          test -s /tmp/search.html
          echo "LIVE=$base"

      - name: Remove temporary access
        if: success()
        run: |
          set -eu
          token="$(cat /tmp/token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          ssh_list="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/ssh/ || true)"
          ssh_id="$(printf '%s' "$ssh_list" | jq -r --arg n "${ALWAYSDATA_ACCOUNT}_deploy" '.[] | select(.name == $n) | .id' | head -n1)"
          if [ -n "$ssh_id" ]; then curl -fsS -X DELETE --basic --user "$auth" "https://api.alwaysdata.com/v1/ssh/${ssh_id}/" >/dev/null || true; fi
          rm -f /tmp/token /tmp/token.enc /tmp/private.pem
