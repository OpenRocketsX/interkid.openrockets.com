name: Sync current Interkid UI to alwaysdata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alwaysdata-live-sync.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALWAYSDATA_ACCOUNT: interkidtest
      HANDOFF_ISSUE: "3"
    steps:
      - name: Checkout current Interkid source
        uses: actions/checkout@v4

      - name: Generate run-bound encryption key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          pub="$(base64 -w0 /tmp/public.pem)"
          response="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" -f body="ALWAYSDATA_PUBLIC_KEY_RUN_${GITHUB_RUN_ID}_B64=${pub}")"
          printf '%s' "$response" | jq -r '.id' >/tmp/public-comment-id

      - name: Receive encrypted alwaysdata token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          payload_path=".github/handoff/${GITHUB_RUN_ID}.b64"
          payload=""
          for attempt in $(seq 1 150); do
            encoded="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${payload_path}" --jq '.content' 2>/dev/null || true)"
            if [ -n "$encoded" ]; then
              payload="$(printf '%s' "$encoded" | tr -d '\n' | base64 -d)"
              [ -n "$payload" ] && break
            fi
            sleep 4
          done
          [ -n "$payload" ] || { echo "Encrypted credential handoff timed out"; exit 1; }
          printf '%s' "$payload" | base64 -d >/tmp/token.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/token.enc -out /tmp/token \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/token
          echo "::add-mask::$(cat /tmp/token)"

      - name: Create temporary SSH login and resolve live release
        run: |
          set -eu
          token="$(cat /tmp/token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          name="${ALWAYSDATA_ACCOUNT}_deploy"
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"

          users="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/ssh/)"
          id="$(printf '%s' "$users" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -n1)"
          payload="$(jq -nc --arg name "$name" --arg pass "$pass" '{name:$name,password:$pass,home_directory:".",shell:"BASH",can_use_password:true,annotation:"Temporary Interkid live sync"}')"
          if [ -n "$id" ]; then
            curl -fsS -X PATCH --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" "https://api.alwaysdata.com/v1/ssh/${id}/" >/dev/null
          else
            result="$(curl -fsS -X POST --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" https://api.alwaysdata.com/v1/ssh/)"
            id="$(printf '%s' "$result" | jq -r '.id')"
          fi
          printf '%s' "$pass" >/tmp/ssh-pass
          printf '%s' "$id" >/tmp/ssh-id

          address="${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          sites="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/site/)"
          site_id="$(printf '%s' "$sites" | jq -r --arg a "$address" '.[] | select(((.addresses // []) | map(rtrimstr("/"))) | index($a)) | .id' | head -n1)"
          workdir="$(printf '%s' "$sites" | jq -r --argjson id "$site_id" '.[] | select(.id == $id) | .working_directory')"
          [ -n "$site_id" ] && [ -n "$workdir" ] && [ "$workdir" != "null" ] || { echo "Could not resolve live Interkid release"; exit 1; }
          printf '%s' "$site_id" >/tmp/site-id
          printf '%s' "$workdir" >/tmp/workdir

      - name: Upload current homepage, verification, and results templates
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          pass="$(cat /tmp/ssh-pass)"
          workdir="$(cat /tmp/workdir)"
          user="${ALWAYSDATA_ACCOUNT}_deploy"
          host="ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          release="/home/${ALWAYSDATA_ACCOUNT}/${workdir}"
          templates="$release/searxng-src/searx/templates/simple"

          ready=0
          for attempt in $(seq 1 18); do
            if SSHPASS="$pass" sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              "$user@$host" "test -w '$release' && test -w '$templates/index.html' && test -w '$templates/base.html' && test -w '$templates/search.html'"; then
              ready=1
              break
            fi
            sleep 4
          done
          [ "$ready" = 1 ] || { echo "Live Interkid release/templates are not writable by temporary SSH user"; exit 1; }

          SSHPASS="$pass" sshpass -e scp -o StrictHostKeyChecking=accept-new index.html "$user@$host:$templates/index.html"
          SSHPASS="$pass" sshpass -e scp -o StrictHostKeyChecking=accept-new verification.html "$user@$host:$release/.verification.html.new"
          SSHPASS="$pass" sshpass -e ssh -o StrictHostKeyChecking=accept-new "$user@$host" "rm -f '$release/verification.html' && mv '$release/.verification.html.new' '$release/verification.html'"
          SSHPASS="$pass" sshpass -e scp -o StrictHostKeyChecking=accept-new searxng/templates/simple/base.html "$user@$host:$templates/base.html"
          SSHPASS="$pass" sshpass -e scp -o StrictHostKeyChecking=accept-new searxng/templates/simple/search.html "$user@$host:$templates/search.html"

      - name: Restart and verify everything requested
        run: |
          set -eu
          token="$(cat /tmp/token)"
          site_id="$(cat /tmp/site-id)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          curl -fsS -X POST --basic --user "$auth" -H 'alwaysdata-synchronous: yes' \
            "https://api.alwaysdata.com/v1/site/${site_id}/restart/" >/dev/null

          base="https://${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          ready=0
          for attempt in $(seq 1 50); do
            code="$(curl -sS -o /tmp/root.html -D /tmp/root.headers -w '%{http_code}' --max-time 15 "$base/" || true)"
            if [ "$code" = "302" ] && grep -qi '^location: /verification' /tmp/root.headers; then
              ready=1
              break
            fi
            sleep 3
          done
          [ "$ready" = 1 ] || { echo "Verification redirect failed"; cat /tmp/root.headers; exit 1; }
          echo "PASS root verification redirect"

          curl -LfsS --max-time 25 "$base/verification" -o /tmp/verification.html
          grep -q '2000' /tmp/verification.html
          grep -q 'Max-Age=86400' /tmp/verification.html
          echo "PASS 2-second verification page"

          curl -LfsS --cookie 'interkid_verification_seen=1' --max-time 25 "$base/" -o /tmp/home.html
          grep -q 'Download the free, secure and safe Interkid Browser' /tmp/home.html
          grep -q 'releases/download/browser-latest/Browser-Setup.exe' /tmp/home.html
          grep -q 'Privacy Policy' /tmp/home.html
          grep -q 'Terms of Service' /tmp/home.html
          grep -q 'About OpenRockets' /tmp/home.html
          echo "PASS homepage browser download and legal ribbon"

          curl -LfsS --max-time 60 "$base/search?q=interkidtitlecheck" -o /tmp/search.html
          grep -q '<title>interkidtitlecheck - Interkid Search</title>' /tmp/search.html
          grep -q 'or-results-footer' /tmp/search.html
          grep -q '© 2024–2026 OpenRockets Inc. All rights reserved.' /tmp/search.html
          ! grep -q 'Powered by' /tmp/search.html
          ! grep -q 'Engine stats' /tmp/search.html
          echo "PASS centered results template, title suffix, and OpenRockets footer"

          curl -LfsS --cookie 'interkid_verification_seen=1' --max-time 30 https://www.interkid.org/ -o /tmp/www.html
          grep -q 'releases/download/browser-latest/Browser-Setup.exe' /tmp/www.html
          echo "PASS public www bridge"
          echo "LIVE_ORIGIN=$base"
          echo "LIVE_PUBLIC=https://www.interkid.org/"

      - name: Remove temporary access
        if: always()
        run: |
          set +e
          token="$(cat /tmp/token 2>/dev/null || true)"
          ssh_id="$(cat /tmp/ssh-id 2>/dev/null || true)"
          if [ -n "$token" ] && [ -n "$ssh_id" ]; then
            curl -fsS -X DELETE --basic --user "${token} account=${ALWAYSDATA_ACCOUNT}:" "https://api.alwaysdata.com/v1/ssh/${ssh_id}/" >/dev/null || true
          fi
          rm -f /tmp/token /tmp/token.enc /tmp/private.pem /tmp/public.pem /tmp/ssh-pass /tmp/ssh-id /tmp/site-id /tmp/workdir /tmp/public-comment-id
          # Intentionally DO NOT revoke or delete the alwaysdata API token.

# run-specific encrypted file handoff; atomic verification replacement
