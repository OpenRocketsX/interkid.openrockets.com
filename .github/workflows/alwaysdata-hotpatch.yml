name: Hotpatch Interkid templates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alwaysdata-hotpatch.yml

permissions:
  contents: read
  issues: write

jobs:
  hotpatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALWAYSDATA_ACCOUNT: interkidtest
      HANDOFF_ISSUE: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ephemeral encryption key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" \
            -f body="ALWAYSDATA_PUBLIC_KEY_RUN_${GITHUB_RUN_ID}_B64=$(base64 -w0 /tmp/public.pem)" >/dev/null

      - name: Receive encrypted token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prefix="ALWAYSDATA_CIPHERTEXT_RUN_${GITHUB_RUN_ID}="
          body=""
          for attempt in $(seq 1 120); do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" --paginate)"
            body="$(printf '%s' "$comments" | jq -r --arg prefix "$prefix" '[.[] | select(.body | startswith($prefix))][-1].body // ""')"
            [ -n "$body" ] && break
            sleep 3
          done
          [ -n "$body" ] || { echo "Encrypted handoff timed out"; exit 1; }
          printf '%s' "${body#"$prefix"}" | base64 -d >/tmp/token.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/token.enc -out /tmp/token \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/token
          echo "::add-mask::$(cat /tmp/token)"

      - name: Create temporary SSH login and resolve live release
        run: |
          set -eu
          token="$(cat /tmp/token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          name="${ALWAYSDATA_ACCOUNT}_deploy"
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"
          users="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/ssh/)"
          id="$(printf '%s' "$users" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -n1)"
          payload="$(jq -nc --arg name "$name" --arg pass "$pass" '{name:$name,password:$pass,home_directory:".",shell:"BASH",can_use_password:true,annotation:"Temporary Interkid template hotpatch"}')"
          if [ -n "$id" ]; then
            curl -fsS -X PATCH --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" "https://api.alwaysdata.com/v1/ssh/${id}/" >/dev/null
          else
            result="$(curl -fsS -X POST --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" https://api.alwaysdata.com/v1/ssh/)"
            id="$(printf '%s' "$result" | jq -r '.id')"
          fi
          printf '%s' "$pass" >/tmp/ssh-pass
          printf '%s' "$id" >/tmp/ssh-id

          address="${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          sites="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/site/)"
          site_id="$(printf '%s' "$sites" | jq -r --arg a "$address" '.[] | select(((.addresses // []) | map(rtrimstr("/"))) | index($a)) | .id' | head -n1)"
          workdir="$(printf '%s' "$sites" | jq -r --argjson id "$site_id" '.[] | select(.id == $id) | .working_directory')"
          [ -n "$site_id" ] && [ -n "$workdir" ] && [ "$workdir" != "null" ] || { echo "Could not resolve live Interkid release"; exit 1; }
          printf '%s' "$site_id" >/tmp/site-id
          printf '%s' "$workdir" >/tmp/workdir

      - name: Upload homepage and results footer templates
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          pass="$(cat /tmp/ssh-pass)"
          workdir="$(cat /tmp/workdir)"
          user="${ALWAYSDATA_ACCOUNT}_deploy"
          host="ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          root="/home/${ALWAYSDATA_ACCOUNT}/${workdir}/searxng-src/searx/templates/simple"

          ready=0
          for attempt in $(seq 1 15); do
            if SSHPASS="$pass" sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              "$user@$host" "test -w '$root/index.html' && test -w '$root/base.html'"; then
              ready=1
              break
            fi
            sleep 4
          done
          [ "$ready" = 1 ] || { echo "Live template directory is not writable by temporary SSH user"; exit 1; }

          SSHPASS="$pass" sshpass -e scp -o StrictHostKeyChecking=accept-new \
            index.html "$user@$host:$root/index.html"
          SSHPASS="$pass" sshpass -e scp -o StrictHostKeyChecking=accept-new \
            searxng/templates/simple/base.html "$user@$host:$root/base.html"

      - name: Restart and verify live behavior
        run: |
          set -eu
          token="$(cat /tmp/token)"
          site_id="$(cat /tmp/site-id)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          curl -fsS -X POST --basic --user "$auth" -H 'alwaysdata-synchronous: yes' \
            "https://api.alwaysdata.com/v1/site/${site_id}/restart/" >/dev/null

          base="https://${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          ready=0
          for attempt in $(seq 1 40); do
            if curl -LfsS --max-time 15 "$base/" -o /tmp/home.html \
              && grep -q 'interkid_verification_seen' /tmp/home.html \
              && grep -q 'accounts.openrockets.com/verification/' /tmp/home.html \
              && grep -q 'Max-Age=86400' /tmp/home.html; then
              ready=1
              break
            fi
            sleep 3
          done
          [ "$ready" = 1 ] || { echo "Verification gate did not become live"; exit 1; }

          curl -LfsS --max-time 60 "$base/search?q=openrockets" -o /tmp/search.html
          grep -q '© 2024–2026 OpenRockets Inc. All rights reserved.' /tmp/search.html
          ! grep -q 'Powered by' /tmp/search.html
          ! grep -q 'Engine stats' /tmp/search.html
          echo "LIVE=$base"

      - name: Report iframe policy headers
        run: |
          curl -LIsS --max-time 20 https://accounts.openrockets.com/verification/ \
            | grep -Ei '^(HTTP/|x-frame-options:|content-security-policy:)' || true

      - name: Remove temporary SSH login and runner credentials
        if: always()
        run: |
          set +e
          token="$(cat /tmp/token 2>/dev/null || true)"
          id="$(cat /tmp/ssh-id 2>/dev/null || true)"
          if [ -n "$token" ] && [ -n "$id" ]; then
            curl -fsS -X DELETE --basic --user "${token} account=${ALWAYSDATA_ACCOUNT}:" "https://api.alwaysdata.com/v1/ssh/${id}/" >/dev/null || true
          fi
          rm -f /tmp/token /tmp/token.enc /tmp/private.pem /tmp/public.pem /tmp/ssh-pass /tmp/ssh-id /tmp/site-id /tmp/workdir
