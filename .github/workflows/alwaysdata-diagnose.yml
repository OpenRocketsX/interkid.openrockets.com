name: Diagnose alwaysdata runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alwaysdata-diagnose.yml

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALWAYSDATA_ACCOUNT: interkidtest
      HANDOFF_ISSUE: "3"
    steps:
      - name: Generate run-bound encryption key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" -f body="ALWAYSDATA_PUBLIC_KEY_RUN_${GITHUB_RUN_ID}_B64=$(base64 -w0 /tmp/public.pem)" >/dev/null

      - name: Receive token for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prefix="ALWAYSDATA_CIPHERTEXT_RUN_${GITHUB_RUN_ID}="
          for attempt in $(seq 1 120); do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" --paginate)"
            body="$(printf '%s' "$comments" | jq -r --arg prefix "$prefix" '[.[] | select(.body | startswith($prefix))][-1].body // ""')"
            [ -n "$body" ] && break
            sleep 5
          done
          [ -n "${body:-}" ] || exit 1
          printf '%s' "${body#"$prefix"}" | base64 -d >/tmp/token.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/token.enc -out /tmp/token -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          echo "::add-mask::$(cat /tmp/token)"

      - name: Create diagnostic SSH login
        run: |
          set -eu
          token="$(cat /tmp/token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          name="${ALWAYSDATA_ACCOUNT}_deploy"
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"
          users="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/ssh/)"
          id="$(printf '%s' "$users" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -n1)"
          payload="$(jq -nc --arg name "$name" --arg pass "$pass" '{name:$name,password:$pass,home_directory:"/",shell:"BASH",can_use_password:true,annotation:"Temporary Interkid diagnostic"}')"
          if [ -n "$id" ]; then
            curl -fsS -X PATCH --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" "https://api.alwaysdata.com/v1/ssh/${id}/" >/dev/null
          else
            result="$(curl -fsS -X POST --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" https://api.alwaysdata.com/v1/ssh/)"
            id="$(printf '%s' "$result" | jq -r '.id')"
          fi
          printf '%s' "$pass" >/tmp/ssh-pass
          printf '%s' "$id" >/tmp/ssh-id

      - name: Read site logs and test SearXNG directly
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          pass="$(cat /tmp/ssh-pass)"
          host="ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          user="${ALWAYSDATA_ACCOUNT}_deploy"
          SSHPASS="$pass" sshpass -e ssh -o StrictHostKeyChecking=accept-new "$user@$host" 'bash -s' <<'REMOTE'
            set +e
            echo '=== SITE LOG FILES ==='
            find "$HOME/admin/logs/sites" -type f -maxdepth 2 -print 2>/dev/null
            echo '=== RECENT SITE LOGS ==='
            find "$HOME/admin/logs/sites" -type f -maxdepth 2 -print0 2>/dev/null | xargs -0 -r tail -n 80
            echo '=== DIRECT START TEST ==='
            cd "$HOME/interkid-search" || exit 1
            IP=127.0.0.1 PORT=8399 ./start.sh >/tmp/interkid-direct.log 2>&1 &
            pid=$!
            sleep 8
            curl -v --max-time 10 http://127.0.0.1:8399/ -o /tmp/interkid-direct.html
            code=$?
            echo "curl_exit=$code"
            grep -i -m1 'interkid' /tmp/interkid-direct.html 2>/dev/null || true
            echo '=== DIRECT SERVER LOG ==='
            cat /tmp/interkid-direct.log
            kill "$pid" 2>/dev/null || true
            exit "$code"
          REMOTE

      - name: Remove diagnostic SSH login
        if: always()
        run: |
          token="$(cat /tmp/token 2>/dev/null || true)"
          id="$(cat /tmp/ssh-id 2>/dev/null || true)"
          if [ -n "$token" ] && [ -n "$id" ]; then curl -fsS -X DELETE --basic --user "${token} account=${ALWAYSDATA_ACCOUNT}:" "https://api.alwaysdata.com/v1/ssh/${id}/" >/dev/null || true; fi
          rm -f /tmp/token /tmp/token.enc /tmp/private.pem /tmp/ssh-pass
