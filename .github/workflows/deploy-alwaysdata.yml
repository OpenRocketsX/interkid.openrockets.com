name: Deploy to alwaysdata

on:
  push:
    branches: [main]
    paths:
      - index.html
      - verification.html
      - searxng/**
      - .github/workflows/deploy-alwaysdata.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alwaysdata-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ALWAYSDATA_ACCOUNT: interkidtest
      LIVE_DIR: interkid-search-34003778331

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSH deployment key
        env:
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          test -n "$ALWAYSDATA_SSH_KEY" || { echo "Missing ALWAYSDATA_SSH_KEY"; exit 1; }

      - name: Configure SSH
        env:
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ALWAYSDATA_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net" >> ~/.ssh/known_hosts

      - name: Package UI and configuration
        run: |
          tar -czf /tmp/interkid-update.tgz \
            index.html \
            verification.html \
            searxng/settings.yml \
            searxng/templates/simple/base.html \
            searxng/templates/simple/search.html

      - name: Upload and update live app
        run: |
          scp /tmp/interkid-update.tgz \
            "${ALWAYSDATA_ACCOUNT}@ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net:~/interkid-update.tgz"

          ssh "${ALWAYSDATA_ACCOUNT}@ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net" \
            "LIVE_DIR='${LIVE_DIR}' sh -s" <<'REMOTE'
          set -eu

          LIVE="$HOME/$LIVE_DIR"
          STAGE="$HOME/interkid-update-stage"

          test -d "$LIVE/searxng-src/searx/templates/simple"
          test -x "$LIVE/venv/bin/python"
          test -s "$LIVE/secret"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          tar -xzf "$HOME/interkid-update.tgz" -C "$STAGE"

          cp "$STAGE/index.html" "$LIVE/searxng-src/searx/templates/simple/index.html"
          cp "$STAGE/verification.html" "$LIVE/verification.html"
          cp "$STAGE/searxng/templates/simple/base.html" "$LIVE/searxng-src/searx/templates/simple/base.html"
          cp "$STAGE/searxng/templates/simple/search.html" "$LIVE/searxng-src/searx/templates/simple/search.html"
          cp "$STAGE/searxng/settings.yml" "$LIVE/config/settings.yml"

          SEARX_SECRET="$(cat "$LIVE/secret")"
          SETTINGS="$LIVE/config/settings.yml" SEARX_SECRET="$SEARX_SECRET" "$LIVE/venv/bin/python" - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["SETTINGS"])
          text = path.read_text()
          text = text.replace('secret_key: "ultrasecretkey"', f'secret_key: "{os.environ["SEARX_SECRET"]}"')
          path.write_text(text)
          PY

          rm -rf "$STAGE" "$HOME/interkid-update.tgz"
          REMOTE

      - name: Verify live homepage, verification and search
        run: |
          URL="https://${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 -H 'Cookie: interkid_verification_seen=1' "$URL/" -o /tmp/home.html; then
              grep -qi '© 2024–2026 OpenRockets Inc. All rights reserved.' /tmp/home.html
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 3
          done

          curl --fail --silent --show-error --max-time 20 "$URL/verification" -o /tmp/verification.html
          grep -q 'accounts.openrockets.com/' /tmp/verification.html
          grep -q 'Max-Age=86400' /tmp/verification.html
          grep -q '2000' /tmp/verification.html

          curl --fail --silent --show-error --max-time 45 \
            "$URL/search?q=openrockets&safesearch=0" -o /tmp/search.html
          grep -q 'interkid-results-wordmark' /tmp/search.html
          grep -q 'https://openrockets.com/' /tmp/search.html
          grep -Eq 'name="safesearch"[^>]*value="2"|value="2"[^>]*name="safesearch"' /tmp/search.html
