name: Deploy to alwaysdata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alwaysdata-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          ALWAYSDATA_ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          test -n "$ALWAYSDATA_ACCOUNT" || { echo "Missing ALWAYSDATA_ACCOUNT"; exit 1; }
          test -n "$ALWAYSDATA_SSH_KEY" || { echo "Missing ALWAYSDATA_SSH_KEY"; exit 1; }

      - name: Configure SSH
        env:
          ALWAYSDATA_ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
          ALWAYSDATA_SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ALWAYSDATA_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net" >> ~/.ssh/known_hosts

      - name: Package deployment payload
        run: |
          tar -czf /tmp/interkid-alwaysdata.tgz \
            index.html \
            searxng/settings.yml \
            searxng/templates/simple/base.html \
            searxng/templates/simple/search.html \
            deploy/alwaysdata/install.sh \
            deploy/alwaysdata/start.sh

      - name: Upload and install
        env:
          ALWAYSDATA_ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
        run: |
          scp /tmp/interkid-alwaysdata.tgz \
            "${ALWAYSDATA_ACCOUNT}@ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net:~/interkid-alwaysdata.tgz"

          ssh "${ALWAYSDATA_ACCOUNT}@ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net" <<'REMOTE'
            set -eu
            rm -rf "$HOME/interkid-deploy"
            mkdir -p "$HOME/interkid-deploy"
            tar -xzf "$HOME/interkid-alwaysdata.tgz" -C "$HOME/interkid-deploy"
            sh "$HOME/interkid-deploy/deploy/alwaysdata/install.sh"
          REMOTE
