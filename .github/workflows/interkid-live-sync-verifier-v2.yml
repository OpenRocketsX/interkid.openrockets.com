name: Patch Interkid live verifier v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/interkid-live-sync-verifier-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verifier lines
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/alwaysdata-live-sync.yml')
          s = p.read_text()
          replacements = [
            ("          echo \"PASS homepage browser download and legal ribbon\"",
             "          grep -q 'https://about.openrockets.com/docs/legal/legal-information' /tmp/home.html\n          grep -q 'browser-download-spinner' /tmp/home.html\n          echo \"PASS homepage browser download, spinner, legal ribbon, and legal URL\""),
            ("          grep -q 'or-results-footer' /tmp/search.html",
             "          grep -q 'data-testid=\"home-footer\"' /tmp/search.html\n          grep -q 'https://about.openrockets.com/docs/legal/legal-information' /tmp/search.html\n          grep -q 'interkid-about-icon' /tmp/search.html\n          grep -q 'interkid-results-mobile-top-row' /tmp/search.html"),
            ("          grep -q '© 2024–2026 OpenRockets Inc. All rights reserved.' /tmp/search.html",
             "          grep -q 'OpenRockets is a 100% teen-run United States C-Corporation.' /tmp/search.html\n          grep -q 'An infrastructure service provider for nonprofits run by exceptional minors and teenagers worldwide.' /tmp/search.html"),
            ("          echo \"PASS centered results template, title suffix, and OpenRockets footer\"",
             "          echo \"PASS centered results, mobile header, title suffix, and authoritative OpenRockets footer\""),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing verifier line: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit verifier
        run: |
          set -eu
          git config user.name "Neksha DeSilva"
          git config user.email "rohandesilvahotmail@gmail.com"
          git add .github/workflows/alwaysdata-live-sync.yml
          git diff --cached --check
          git commit -m "Verify polished Interkid UI live"
          git push origin HEAD:main
