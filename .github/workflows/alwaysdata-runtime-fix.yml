name: Apply alwaysdata runtime fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alwaysdata-runtime-fix.yml

permissions:
  contents: read
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ALWAYSDATA_ACCOUNT: interkidtest
      HANDOFF_ISSUE: "3"
      TOKEN_APP_NAME: iutuy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate run-bound encryption key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" \
            -f body="ALWAYSDATA_PUBLIC_KEY_RUN_${GITHUB_RUN_ID}_B64=$(base64 -w0 /tmp/public.pem)" >/dev/null

      - name: Receive token for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prefix="ALWAYSDATA_CIPHERTEXT_RUN_${GITHUB_RUN_ID}="
          body=""
          for attempt in $(seq 1 120); do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" --paginate)"
            body="$(printf '%s' "$comments" | jq -r --arg prefix "$prefix" '[.[] | select(.body | startswith($prefix))][-1].body // ""')"
            [ -n "$body" ] && break
            sleep 5
          done
          [ -n "$body" ] || { echo "Credential handoff timed out"; exit 1; }
          printf '%s' "${body#"$prefix"}" | base64 -d >/tmp/token.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/token.enc -out /tmp/token \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/token
          echo "::add-mask::$(cat /tmp/token)"

      - name: Create temporary deployment SSH login
        run: |
          set -eu
          token="$(cat /tmp/token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          name="${ALWAYSDATA_ACCOUNT}_deploy"
          pass="$(openssl rand -hex 24)"
          echo "::add-mask::$pass"
          users="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/ssh/)"
          id="$(printf '%s' "$users" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -n1)"
          payload="$(jq -nc --arg name "$name" --arg pass "$pass" '{name:$name,password:$pass,home_directory:"/",shell:"BASH",can_use_password:true,annotation:"Temporary Interkid runtime fix"}')"
          if [ -n "$id" ]; then
            curl -fsS -X PATCH --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" "https://api.alwaysdata.com/v1/ssh/${id}/" >/dev/null
          else
            result="$(curl -fsS -X POST --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" https://api.alwaysdata.com/v1/ssh/)"
            id="$(printf '%s' "$result" | jq -r '.id')"
          fi
          printf '%s' "$pass" >/tmp/ssh-pass
          printf '%s' "$id" >/tmp/ssh-id
          sleep 20

      - name: Upload fixed start script and test locally
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          pass="$(cat /tmp/ssh-pass)"
          host="ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          user="${ALWAYSDATA_ACCOUNT}_deploy"
          uploaded=0
          for attempt in $(seq 1 8); do
            if SSHPASS="$pass" sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              deploy/alwaysdata/start.sh "$user@$host:~/interkid-search/start.sh"; then
              uploaded=1
              break
            fi
            echo "SSH credentials not active yet; retry $attempt/8"
            sleep 10
          done
          [ "$uploaded" = 1 ] || { echo "Could not upload runtime fix"; exit 1; }
          SSHPASS="$pass" sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "$user@$host" 'bash -s' <<'REMOTE'
            set -eu
            chmod 755 "$HOME/interkid-search/start.sh"
            cd "$HOME/interkid-search"
            IP=127.0.0.1 PORT=8399 ./start.sh >/tmp/interkid-runtime-test.log 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            ready=0
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:8399/ -o /tmp/interkid-runtime-home.html; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then
              cat /tmp/interkid-runtime-test.log
              exit 1
            fi
            grep -qi 'interkid' /tmp/interkid-runtime-home.html || { echo 'Homepage response missing Interkid'; head -c 500 /tmp/interkid-runtime-home.html; exit 1; }
          REMOTE

      - name: Restart alwaysdata site
        run: |
          set -eu
          token="$(cat /tmp/token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          sites="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/site/)"
          site_id="$(printf '%s' "$sites" | jq -r --arg a "${ALWAYSDATA_ACCOUNT}.alwaysdata.net/" '.[] | select(any(.addresses[]?; . == $a)) | .id' | head -n1)"
          [ -n "$site_id" ] || { echo "Interkid site not found"; exit 1; }
          curl -fsS -X POST --basic --user "$auth" "https://api.alwaysdata.com/v1/site/${site_id}/restart/" >/dev/null

      - name: Verify public homepage and search
        run: |
          set -eu
          base="https://${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          ready=0
          for attempt in $(seq 1 60); do
            if curl -LfsS --max-time 20 "$base/" -o /tmp/home.html && grep -qi 'interkid' /tmp/home.html; then ready=1; break; fi
            sleep 3
          done
          [ "$ready" = 1 ] || { echo "Public homepage did not become ready"; exit 1; }
          curl -LfsS --max-time 60 "$base/search?q=openrockets" -o /tmp/search.html
          test -s /tmp/search.html
          echo "INTERKID_LIVE_URL=$base"

      - name: Revoke supplied API token after successful verification
        if: success()
        run: |
          set -eu
          token="$(cat /tmp/token)"
          tokens="$(curl -fsS --basic --user "$token:" https://api.alwaysdata.com/v1/token/)"
          token_id="$(printf '%s' "$tokens" | jq -r --arg app "$TOKEN_APP_NAME" '.[] | select(.app_name == $app) | .id' | head -n1)"
          if [ -n "$token_id" ]; then
            curl -fsS -X DELETE --basic --user "$token:" "https://api.alwaysdata.com/v1/token/${token_id}/" >/dev/null || true
          fi

      - name: Remove temporary SSH login and local credentials
        if: always()
        run: |
          token="$(cat /tmp/token 2>/dev/null || true)"
          ssh_id="$(cat /tmp/ssh-id 2>/dev/null || true)"
          if [ -n "$token" ] && [ -n "$ssh_id" ]; then
            curl -fsS -X DELETE --basic --user "${token} account=${ALWAYSDATA_ACCOUNT}:" "https://api.alwaysdata.com/v1/ssh/${ssh_id}/" >/dev/null || true
          fi
          rm -f /tmp/token /tmp/token.enc /tmp/private.pem /tmp/ssh-pass /tmp/ssh-id
