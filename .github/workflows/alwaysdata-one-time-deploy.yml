name: One-time alwaysdata deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alwaysdata-one-time-deploy.yml

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALWAYSDATA_ACCOUNT: interkidtest
      HANDOFF_ISSUE: "3"
      TOKEN_APP_NAME: iutuy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and publish ephemeral encryption key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/alwaysdata-private.pem 2>/dev/null
          openssl pkey -in /tmp/alwaysdata-private.pem -pubout -out /tmp/alwaysdata-public.pem
          public_key="$(base64 -w0 /tmp/alwaysdata-public.pem)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" \
            -f body="ALWAYSDATA_PUBLIC_KEY_RUN_${GITHUB_RUN_ID}_B64=${public_key}" >/dev/null

      - name: Receive encrypted token for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prefix="ALWAYSDATA_CIPHERTEXT_RUN_${GITHUB_RUN_ID}="
          body=""
          for attempt in $(seq 1 120); do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" --paginate)"
            body="$(printf '%s' "$comments" | jq -r --arg prefix "$prefix" '[.[] | select(.body | startswith($prefix))][-1].body // ""')"
            [ -n "$body" ] && break
            sleep 5
          done
          [ -n "$body" ] || { echo "Encrypted handoff was not received for run ${GITHUB_RUN_ID}"; exit 1; }
          ciphertext="${body#"$prefix"}"
          printf '%s' "$ciphertext" | base64 -d > /tmp/alwaysdata-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/alwaysdata-private.pem \
            -in /tmp/alwaysdata-token.enc \
            -out /tmp/alwaysdata-token \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/alwaysdata-token
          token="$(cat /tmp/alwaysdata-token)"
          echo "::add-mask::$token"

      - name: Configure temporary SSH user
        run: |
          set -eu
          token="$(cat /tmp/alwaysdata-token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          deploy_user="${ALWAYSDATA_ACCOUNT}_deploy"
          deploy_password="$(openssl rand -hex 24)"
          echo "::add-mask::$deploy_password"
          ssh_list="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/ssh/)"
          ssh_id="$(printf '%s' "$ssh_list" | jq -r --arg n "$deploy_user" '.[] | select(.name == $n) | .id' | head -n1)"
          payload="$(jq -nc --arg name "$deploy_user" --arg password "$deploy_password" '{name:$name,password:$password,home_directory:"/",shell:"BASH",can_use_password:true,annotation:"Temporary Interkid deployment user"}')"
          if [ -n "$ssh_id" ]; then
            curl -fsS -X PATCH --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" "https://api.alwaysdata.com/v1/ssh/${ssh_id}/" >/tmp/ssh-result.json
          else
            curl -fsS -X POST --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" https://api.alwaysdata.com/v1/ssh/ >/tmp/ssh-result.json
            ssh_id="$(jq -r '.id' /tmp/ssh-result.json)"
          fi
          printf '%s' "$deploy_password" > /tmp/alwaysdata-ssh-password
          printf '%s' "$ssh_id" > /tmp/alwaysdata-ssh-id
          printf '%s' "$deploy_user" > /tmp/alwaysdata-ssh-user

      - name: Install Interkid and SearXNG
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          deploy_user="$(cat /tmp/alwaysdata-ssh-user)"
          deploy_password="$(cat /tmp/alwaysdata-ssh-password)"
          host="ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          tar -czf /tmp/interkid-alwaysdata.tgz index.html searxng/settings.yml deploy/alwaysdata/install.sh deploy/alwaysdata/start.sh
          SSHPASS="$deploy_password" sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/interkid-alwaysdata.tgz "${deploy_user}@${host}:~/interkid-alwaysdata.tgz"
          SSHPASS="$deploy_password" sshpass -e ssh -o StrictHostKeyChecking=accept-new "${deploy_user}@${host}" \
            'rm -rf "$HOME/interkid-deploy" && mkdir -p "$HOME/interkid-deploy" && tar -xzf "$HOME/interkid-alwaysdata.tgz" -C "$HOME/interkid-deploy" && sh "$HOME/interkid-deploy/deploy/alwaysdata/install.sh"'

      - name: Configure alwaysdata user-program site
        run: |
          set -eu
          token="$(cat /tmp/alwaysdata-token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          address="${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          sites="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/site/)"
          printf '%s' "$sites" | jq '[.[] | {id,type,addresses,annotation,working_directory,command}]'
          site_id="$(printf '%s' "$sites" | jq -r --arg a "$address" '.[] | select((.addresses // []) | index($a)) | .id' | head -n1)"
          payload="$(jq -nc --arg address "$address" '{type:"user_program",addresses:[$address],command:"./start.sh",working_directory:"interkid-search",ssl_force:true,annotation:"Interkid Search"}')"
          response=/tmp/site-response.json
          if [ -n "$site_id" ]; then
            code="$(curl -sS -o "$response" -w '%{http_code}' -X PATCH --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" "https://api.alwaysdata.com/v1/site/${site_id}/")"
          else
            code="$(curl -sS -o "$response" -w '%{http_code}' -X POST --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" https://api.alwaysdata.com/v1/site/)"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then site_id="$(jq -r '.id' "$response")"; fi
          fi
          cat "$response"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "alwaysdata site API returned HTTP $code"; exit 1; fi
          printf '%s' "$site_id" > /tmp/alwaysdata-site-id
          curl -fsS -X POST --basic --user "$auth" "https://api.alwaysdata.com/v1/site/${site_id}/restart/" >/dev/null || true

      - name: Verify live Interkid search
        run: |
          set -eu
          base="https://${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          ok=0
          for attempt in $(seq 1 60); do
            if curl -LfsS --max-time 20 "$base/" -o /tmp/interkid-home.html && grep -qi 'interkid' /tmp/interkid-home.html; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "Homepage did not become ready"; exit 1; }
          curl -LfsS --max-time 60 "$base/search?q=openrockets" -o /tmp/interkid-search.html
          test -s /tmp/interkid-search.html
          echo "INTERKID_LIVE_URL=$base"

      - name: Remove temporary deployment access
        if: success()
        run: |
          set -eu
          token="$(cat /tmp/alwaysdata-token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          ssh_id="$(cat /tmp/alwaysdata-ssh-id)"
          curl -fsS -X DELETE --basic --user "$auth" "https://api.alwaysdata.com/v1/ssh/${ssh_id}/" >/dev/null || true
          tokens="$(curl -fsS --basic --user "$token:" https://api.alwaysdata.com/v1/token/ || true)"
          token_id="$(printf '%s' "$tokens" | jq -r --arg app "$TOKEN_APP_NAME" '.[] | select((.app_name // .application // .name // "") == $app) | .id' | head -n1)"
          if [ -n "$token_id" ]; then curl -fsS -X DELETE --basic --user "$token:" "https://api.alwaysdata.com/v1/token/${token_id}/" >/dev/null || true; fi
          rm -f /tmp/alwaysdata-token /tmp/alwaysdata-token.enc /tmp/alwaysdata-private.pem /tmp/alwaysdata-ssh-password
