name: One-time alwaysdata deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/alwaysdata-one-time-deploy.yml

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALWAYSDATA_ACCOUNT: interkidtest
      HANDOFF_ISSUE: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and publish ephemeral encryption key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/alwaysdata-private.pem 2>/dev/null
          openssl pkey -in /tmp/alwaysdata-private.pem -pubout -out /tmp/alwaysdata-public.pem
          public_key="$(base64 -w0 /tmp/alwaysdata-public.pem)"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" \
            -f body="ALWAYSDATA_PUBLIC_KEY_RUN_${GITHUB_RUN_ID}_B64=${public_key}" >/dev/null

      - name: Receive encrypted token for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prefix="ALWAYSDATA_CIPHERTEXT_RUN_${GITHUB_RUN_ID}="
          body=""
          for attempt in $(seq 1 120); do
            comments="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${HANDOFF_ISSUE}/comments" --paginate)"
            body="$(printf '%s' "$comments" | jq -r --arg prefix "$prefix" '[.[] | select(.body | startswith($prefix))][-1].body // ""')"
            [ -n "$body" ] && break
            sleep 5
          done
          [ -n "$body" ] || { echo "Encrypted handoff was not received for run ${GITHUB_RUN_ID}"; exit 1; }
          ciphertext="${body#"$prefix"}"
          printf '%s' "$ciphertext" | base64 -d > /tmp/alwaysdata-token.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/alwaysdata-private.pem \
            -in /tmp/alwaysdata-token.enc \
            -out /tmp/alwaysdata-token \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/alwaysdata-token
          token="$(cat /tmp/alwaysdata-token)"
          echo "::add-mask::$token"

      - name: Configure temporary SSH user
        run: |
          set -eu
          token="$(cat /tmp/alwaysdata-token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          deploy_user="${ALWAYSDATA_ACCOUNT}_deploy"
          deploy_password="$(openssl rand -hex 24)"
          echo "::add-mask::$deploy_password"
          ssh_list="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/ssh/)"
          ssh_id="$(printf '%s' "$ssh_list" | jq -r --arg n "$deploy_user" '.[] | select(.name == $n) | .id' | head -n1)"
          payload="$(jq -nc --arg name "$deploy_user" --arg password "$deploy_password" '{name:$name,password:$password,home_directory:".",shell:"BASH",can_use_password:true,annotation:"Temporary Interkid deployment user"}')"
          if [ -n "$ssh_id" ]; then
            curl -fsS -X PATCH --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" "https://api.alwaysdata.com/v1/ssh/${ssh_id}/" >/tmp/ssh-result.json
          else
            curl -fsS -X POST --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" https://api.alwaysdata.com/v1/ssh/ >/tmp/ssh-result.json
            ssh_id="$(jq -r '.id' /tmp/ssh-result.json)"
          fi
          printf '%s' "$deploy_password" > /tmp/alwaysdata-ssh-password
          printf '%s' "$ssh_id" > /tmp/alwaysdata-ssh-id
          printf '%s' "$deploy_user" > /tmp/alwaysdata-ssh-user

      - name: Install versioned Interkid and SearXNG
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          deploy_user="$(cat /tmp/alwaysdata-ssh-user)"
          deploy_password="$(cat /tmp/alwaysdata-ssh-password)"
          host="ssh-${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          account_root="/home/${ALWAYSDATA_ACCOUNT}"
          remote_tar="${account_root}/admin/tmp/interkid-alwaysdata-${GITHUB_RUN_ID}.tgz"
          remote_stage="${account_root}/admin/tmp/interkid-deploy-${GITHUB_RUN_ID}"
          deploy_name="interkid-search-${GITHUB_RUN_ID}"
          printf '%s' "$deploy_name" > /tmp/alwaysdata-deploy-name

          tar -czf /tmp/interkid-alwaysdata.tgz \
            index.html \
            searxng/settings.yml \
            searxng/templates/simple/base.html \
            searxng/templates/simple/search.html \
            deploy/alwaysdata/install.sh \
            deploy/alwaysdata/start.sh

          ready=0
          for attempt in $(seq 1 15); do
            if SSHPASS="$deploy_password" sshpass -e ssh \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              "${deploy_user}@${host}" \
              "test -w '${account_root}/admin/tmp' && test -w '${account_root}'"; then
              ready=1
              break
            fi
            sleep 4
          done
          [ "$ready" = 1 ] || { echo "Temporary SSH user did not gain writable account access"; exit 1; }

          SSHPASS="$deploy_password" sshpass -e scp \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            /tmp/interkid-alwaysdata.tgz "${deploy_user}@${host}:${remote_tar}"

          SSHPASS="$deploy_password" sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "${deploy_user}@${host}" \
            "ACCOUNT_ROOT='${account_root}' REMOTE_TAR='${remote_tar}' REMOTE_STAGE='${remote_stage}' DEPLOY_NAME='${deploy_name}' bash -s" <<'REMOTE'
          set -eu
          rm -rf "$REMOTE_STAGE"
          mkdir -p "$REMOTE_STAGE"
          tar -xzf "$REMOTE_TAR" -C "$REMOTE_STAGE"
          HOME="$ACCOUNT_ROOT" INTERKID_ROOT="$ACCOUNT_ROOT/$DEPLOY_NAME" INTERKID_STAGE="$REMOTE_STAGE" \
            sh "$REMOTE_STAGE/deploy/alwaysdata/install.sh"
          rm -f "$REMOTE_TAR"
          REMOTE

      - name: Point alwaysdata site at new release
        run: |
          set -eu
          token="$(cat /tmp/alwaysdata-token)"
          auth="${token} account=${ALWAYSDATA_ACCOUNT}:"
          address="${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          deploy_name="$(cat /tmp/alwaysdata-deploy-name)"
          sites="$(curl -fsS --basic --user "$auth" https://api.alwaysdata.com/v1/site/)"
          site_id="$(printf '%s' "$sites" | jq -r --arg a "$address" '.[] | select(((.addresses // []) | map(rtrimstr("/"))) | index($a)) | .id' | head -n1)"
          [ -n "$site_id" ] || { echo "Existing Interkid alwaysdata site not found"; exit 1; }
          payload="$(jq -nc --arg workdir "$deploy_name" --arg base_url "https://${address}/" '{type:"user_program",command:"./start.sh",working_directory:$workdir,environment:("SEARXNG_BASE_URL="+$base_url),ssl_force:true}')"
          code="$(curl -sS -o /tmp/site-response.json -w '%{http_code}' -X PATCH --basic --user "$auth" -H 'Content-Type: application/json' -H 'alwaysdata-synchronous: yes' --data "$payload" "https://api.alwaysdata.com/v1/site/${site_id}/")"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat /tmp/site-response.json
            echo "alwaysdata site API returned HTTP $code"
            exit 1
          fi
          curl -fsS -X POST --basic --user "$auth" -H 'alwaysdata-synchronous: yes' "https://api.alwaysdata.com/v1/site/${site_id}/restart/" >/dev/null

      - name: Verify live Interkid homepage, branding and strict search
        run: |
          set -eu
          base="https://${ALWAYSDATA_ACCOUNT}.alwaysdata.net"
          ok=0
          for attempt in $(seq 1 60); do
            if curl -LfsS --max-time 20 "$base/" -o /tmp/interkid-home.html \
              && grep -q '2024–2026 OpenRockets Inc. All rights reserved.' /tmp/interkid-home.html; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "Updated homepage did not become ready"; exit 1; }

          curl -LfsS --max-time 60 "$base/search?q=openrockets&safesearch=0" -o /tmp/interkid-search.html
          grep -q 'interkid-results-wordmark' /tmp/interkid-search.html
          grep -Eq 'name="safesearch"[^>]*value="2"|value="2"[^>]*name="safesearch"' /tmp/interkid-search.html
          grep -q 'https://openrockets.com/' /tmp/interkid-search.html
          if grep -q 'simple/filters/safesearch' /tmp/interkid-search.html; then
            echo "Safe Search selector unexpectedly present"
            exit 1
          fi
          echo "INTERKID_LIVE_URL=$base"

      - name: Remove temporary SSH login and runner credentials
        if: always()
        run: |
          set +e
          token="$(cat /tmp/alwaysdata-token 2>/dev/null || true)"
          ssh_id="$(cat /tmp/alwaysdata-ssh-id 2>/dev/null || true)"
          if [ -n "$token" ] && [ -n "$ssh_id" ]; then
            curl -fsS -X DELETE --basic --user "${token} account=${ALWAYSDATA_ACCOUNT}:" "https://api.alwaysdata.com/v1/ssh/${ssh_id}/" >/dev/null || true
          fi
          rm -f /tmp/alwaysdata-token /tmp/alwaysdata-token.enc /tmp/alwaysdata-private.pem /tmp/alwaysdata-public.pem /tmp/alwaysdata-ssh-password /tmp/alwaysdata-ssh-id /tmp/alwaysdata-ssh-user
