name: Execute offline Interkid UI polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/interkid-ui-polish-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/apply_interkid_ui_polish_v3.py
      - name: Commit verified UI changes
        run: |
          set -eu
          git config user.name "Neksha DeSilva"
          git config user.email "rohandesilvahotmail@gmail.com"
          git add index.html searxng/templates/simple/base.html searxng/templates/simple/search.html
          git diff --cached --check
          git commit -m "Polish Interkid legal footer promo and mobile search results"
          git push origin HEAD:main
