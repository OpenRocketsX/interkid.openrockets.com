name: Build Interkid Search

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - index.html
      - searxng/**
      - docker/**
      - .github/workflows/container.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - index.html
      - searxng/**
      - docker/**
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: interkid-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/openrocketsx/interkid-search

jobs:
  validate:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t interkid-search:test .

      - name: Start SearXNG
        run: |
          docker run -d \
            --name interkid-search \
            -p 8080:8080 \
            -e SEARXNG_BASE_URL=http://127.0.0.1:8080/ \
            -e SEARXNG_SECRET=actions-smoke-test-secret-not-for-production \
            interkid-search:test

      - name: Wait for homepage
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/ >/tmp/home.html; then
              grep -qi 'interkid' /tmp/home.html
              exit 0
            fi
            sleep 2
          done
          docker logs interkid-search
          exit 1

      - name: Smoke-test search endpoint
        run: |
          curl --fail --silent --show-error --max-time 45 \
            'http://127.0.0.1:8080/search?q=openrockets' \
            -o /tmp/search.html
          test -s /tmp/search.html

      - name: Container logs on failure
        if: failure()
        run: docker logs interkid-search || true

  publish:
    name: Publish GHCR image
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
