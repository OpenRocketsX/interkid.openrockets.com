<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Interkid — safe web search by OpenRockets.">
  <title>interkid</title>

  <link rel="icon" href="https://openrockets.com/favicon.ico" sizes="any">
  <link rel="shortcut icon" href="https://openrockets.com/favicon.ico">
  <link rel="apple-touch-icon" href="https://openrockets.com/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "Google Sans Flex";
      src: url("https://fonts.gstatic.com/s/googlesans/v29/4UaGrENHsxJlGDuGo1OIlL3Owp5eKQtG.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      font-family: "Google Sans Flex", "Outfit", "Google Sans", "Product Sans", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%; min-width: 100%; min-height: 100%; margin: 0; padding: 0;
      background: #0a0a0a; overflow: hidden;
    }

    body { min-height: 100svh; -webkit-tap-highlight-color: transparent; }

    .hero {
      position: relative; width: 100%; min-height: 100svh; display: grid; place-items: center;
      overflow: hidden; isolation: isolate; background: #0a0a0a;
    }

    .video-shell, .video-shade, .video-fallback {
      position: absolute; inset: 0; pointer-events: none; user-select: none;
      -webkit-user-select: none; -webkit-user-drag: none;
    }

    .video-shell { z-index: -3; overflow: hidden; background: #0a0a0a; }

    .video-fallback {
      z-index: -4;
      background:
        linear-gradient(180deg, rgba(5,5,5,0.18), rgba(5,5,5,0.5)),
        url("https://i.ytimg.com/vi/IUN664s7N-c/maxresdefault.jpg") center center / cover no-repeat,
        #111;
      transform: scale(1.025);
      filter: brightness(0.72) contrast(1.08) saturate(0.88);
    }

    .video-shell iframe {
      position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw;
      min-width: 177.78vh; min-height: 100vh; transform: translate(-50%, -50%);
      border: 0; pointer-events: none; opacity: 0;
      filter: brightness(0.84) contrast(1.12) saturate(0.92);
      transition: opacity 500ms ease;
    }

    .video-shell iframe.is-playing { opacity: 0.48; }

    .video-shade {
      z-index: -2;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,0.05), rgba(0,0,0,0.18) 42%, rgba(0,0,0,0.46) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.08) 45%, rgba(0,0,0,0.38) 100%);
    }

    .hero-inner {
      width: min(740px, calc(100% - 32px));
      transform: translateY(-2.4vh);
      text-align: center;
    }

    .brand {
      margin: 0 0 22px; color: #fff; font-family: "Google Sans Flex", "Outfit", sans-serif;
      font-size: clamp(3.6rem, 9vw, 5.5rem); font-weight: 500; line-height: 0.94;
      letter-spacing: -0.055em; text-shadow: 0 2px 26px rgba(0,0,0,0.22);
      user-select: none; -webkit-user-select: none; -webkit-user-drag: none; cursor: default;
    }

    .search-form { position: relative; width: 100%; margin: 0 auto; }

    .search-surface {
      position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center; min-height: 56px; padding: 4px 6px 4px 3px;
      border: 1px solid rgba(0,0,0,0.16); border-radius: 999px;
      background: rgba(255,255,255,0.97);
      box-shadow: 0 12px 42px rgba(0,0,0,0.22), 0 2px 10px rgba(0,0,0,0.12), inset 0 0 0 1px rgba(255,255,255,0.75);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }

    .search-surface:focus-within {
      transform: translateY(-1px); border-color: #000;
      box-shadow: 0 15px 50px rgba(0,0,0,0.26), 0 0 0 3px rgba(255,255,255,0.22), inset 0 0 0 1px rgba(255,255,255,0.8);
    }

    .search-icon { width: 21px; height: 21px; margin: auto; color: #151515; pointer-events: none; }

    #q {
      width: 100%; min-width: 0; height: 46px; padding: 0 10px 0 0; border: 0; outline: 0;
      background: transparent; color: #111;
      font: 500 1.04rem/1.2 "Google Sans Flex", "Outfit", system-ui, sans-serif;
      letter-spacing: -0.012em; appearance: none; -webkit-appearance: none;
    }

    #q::placeholder { color: #777; opacity: 1; font-weight: 400; }
    #q::-webkit-search-cancel-button { display: none; }

    .actions { display: flex; align-items: center; gap: 3px; }

    .icon-button {
      width: 42px; height: 42px; display: grid; place-items: center; padding: 0; border: 0;
      border-radius: 50%; cursor: pointer;
      transition: transform 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    .clear-button { background: transparent; color: #333; opacity: 0; pointer-events: none; }
    .clear-button.visible { opacity: 1; pointer-events: auto; }
    .clear-button:hover, .clear-button:focus-visible { background: #ececec; }

    .submit-button { background: #0b0b0b; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.24); }
    .submit-button:hover, .submit-button:focus-visible { background: #232323; transform: scale(1.035); }
    .icon-button:active { transform: scale(0.95); }
    .icon-button svg { width: 20px; height: 20px; }

    .copyright-ribbon {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 5;
      max-width: calc(100vw - 32px);
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(0,0,0,0.34);
      color: rgba(255,255,255,0.76);
      font: 400 0.74rem/1.2 "Google Sans Flex", "Outfit", system-ui, sans-serif;
      letter-spacing: -0.01em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
      -webkit-user-select: none;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    @media (max-width: 640px) {
      .hero-inner {
        width: min(100% - 20px, 680px);
        transform: translateY(-4vh);
      }

      .brand {
        margin-bottom: 17px;
        font-size: clamp(3.15rem, 17vw, 4.5rem);
      }

      .search-surface {
        min-height: 52px;
        grid-template-columns: 42px minmax(0, 1fr) auto;
        padding: 3px 5px 3px 2px;
      }

      #q { height: 44px; font-size: 1rem; }
      .icon-button { width: 38px; height: 38px; }
      .search-icon { width: 20px; height: 20px; }

      .copyright-ribbon {
        left: 50%;
        bottom: max(10px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100vw - 20px);
        padding: 6px 9px;
        font-size: 0.67rem;
        white-space: normal;
        text-align: center;
      }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      .hero-inner { transform: translateY(-1vh); }
      .brand { margin-bottom: 12px; font-size: clamp(2.6rem, 11vh, 4rem); }
      .copyright-ribbon { bottom: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .search-surface, .icon-button, .video-shell iframe { transition: none; }
    }
  </style>
</head>
<body>
  <main class="hero" aria-labelledby="interkid-title">
    <div class="video-fallback" aria-hidden="true"></div>

    <div class="video-shell" aria-hidden="true">
      <iframe
        id="hero-video"
        title=""
        tabindex="-1"
        allow="autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>

    <div class="video-shade" aria-hidden="true"></div>

    <section class="hero-inner">
      <h1 class="brand" id="interkid-title" draggable="false">interkid</h1>

      <form class="search-form" action="/search" method="get" role="search">
        <label class="sr-only" for="q">Search the internet</label>

        <div class="search-surface">
          <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>

          <input id="q" name="q" type="search" placeholder="Search the internet" autocomplete="off"
            autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">

          <input type="hidden" name="safesearch" value="2">

          <div class="actions">
            <button class="icon-button clear-button" id="clear-search" type="button" aria-label="Clear search">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                <path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>

            <button class="icon-button submit-button" type="submit" aria-label="Search">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                <path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <div class="copyright-ribbon" aria-label="Copyright">
    © 2024–2026 OpenRockets Inc. All rights reserved.
  </div>

  <script>
    (() => {
      const input = document.getElementById("q");
      const clearButton = document.getElementById("clear-search");
      const video = document.getElementById("hero-video");

      const syncClearButton = () => clearButton.classList.toggle("visible", input.value.length > 0);
      input.addEventListener("input", syncClearButton);
      clearButton.addEventListener("click", () => {
        input.value = "";
        syncClearButton();
        input.focus();
      });
      syncClearButton();

      if (window.matchMedia("(pointer:fine)").matches && window.innerWidth > 720) {
        window.setTimeout(() => input.focus({ preventScroll: true }), 120);
      }

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const saveData = navigator.connection && navigator.connection.saveData;

      if (!reducedMotion && !saveData) {
        const origin = encodeURIComponent(window.location.origin);
        const src = "https://www.youtube.com/embed/IUN664s7N-c" +
          "?autoplay=1&mute=1&controls=0&loop=1&playlist=IUN664s7N-c" +
          "&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin=" + origin;

        video.src = src;

        const revealVideo = () => video.classList.add("is-playing");
        video.addEventListener("load", () => {
          window.setTimeout(revealVideo, 900);
        }, { once: true });

        window.setTimeout(() => {
          if (!video.classList.contains("is-playing")) {
            video.removeAttribute("src");
          }
        }, 9000);
      }
    })();
  </script>
</body>
</html>
